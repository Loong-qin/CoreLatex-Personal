services:
  corelatex:
    build: .
    image: corelatex:latest
    container_name: corelatex
    ports:
      - "3333:3333"
    volumes:
      # 数据目录(数据库/项目文件/技能/快照/密钥)持久化到宿主机 ./data：
      # 容器删除、镜像重建都不影响数据；裸进程模式用的也是同一目录
      - ./data:/data
    environment:
      - CORELATEX_DATA_DIR=/data
      - HOST=0.0.0.0
      - PORT=3333
      - TZ=Asia/Shanghai
      # 可选的自建搜索后端；地址必须能从应用容器内访问。
      - CORELATEX_SEARXNG_URL=${CORELATEX_SEARXNG_URL:-}
    # 宿主机的数据目录应允许容器用户 UID/GID 1000 读写。
    user: "1000:1000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
